version: '3.8'

services:
  # 1. Frontend (SvelteKit)
  # Membangun container langsung dari file Dockerfile di folder ini
  frontend:
    image: ghcr.io/it-bcs-tech/erp-bcs-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_frontend
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
      - ORIGIN=http://erp.bcslabs.tech
      - API_URL=http://api.bcslabs.tech # Server-side, lewat Nginx Pusat (HTTP → FastCGI → PHP-FPM)
      - AI_BRIDGE_URL=http://ai-bridge:8000  # Python AI Bridge (internal Docker network)
    networks:
      - erp_network

  # 2. Database (Contoh: PostgreSQL, Anda bisa ganti ke MySQL jika tim backend menggunakan MySQL)
  database:
    image: postgres:15-alpine
    container_name: mybcs_database
    restart: always
    environment:
      POSTGRES_USER: bcs_admin
      POSTGRES_PASSWORD: sangatrahasia
      POSTGRES_DB: mybcs_db
    ports:
      - "5433:5432" # Dibuka agar Anda bisa mengecek DB menggunakan DBeaver/TablePlus dari Macbook
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - erp_network

  # 3. Cache & Message Broker (Redis untuk fitur real-time & Telemetri)
  redis:
    image: redis:7-alpine
    container_name: mybcs_redis
    restart: always
    ports:
      - "6380:6379"
    networks:
      - erp_network

  # =========================================================================
  # BAGIAN DI BAWAH INI ADALAH KERANGKA UNTUK TIM BACKEND & PRESENSI
  # Jika tim sudah siap, cukup hapus tanda pagar (#) untuk menyalakannya
  # =========================================================================

  # 4. Backend Utama (Laravel PHP-FPM - Core ERP API)
  # Nginx Pusat di server Biznet yang menerjemahkan HTTP → FastCGI
  backend:
    image: ghcr.io/it-bcs-tech/erp-bcs-backend:latest
    container_name: erp_backend
    ports:
      - "9001:9000"  # PHP-FPM, diakses oleh Nginx Pusat via fastcgi_pass
    env_file:
      - .env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      - database
      - redis
    networks:
      - erp_network

  # 5. Presensi (Laravel Filament PHP-FPM)
  # presensi:
  #   image: ghcr.io/it-bcs-tech/presensi-app:latest
  #   container_name: erp_presensi
  #   ports:
  #     - "9002:9000"  # PHP-FPM, dilayani oleh Nginx Pusat Server Biznet
  #   env_file:
  #     - .env.presensi
  #   volumes:
  #     - presensi_storage:/var/www/html/storage
  #   depends_on:
  #     - database
  #   networks:
  #     - erp_network

  # 6. Golang Microservice (FMS Telemetry)
  # golang-fms:
  #   image: ghcr.io/it-bcs-tech/erp-fms-telemetry:latest
  #   container_name: erp_golang_fms
  #   ports:
  #     - "8081:8081"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - database
  #     - redis
  #   networks:
  #     - erp_network

  # 7. Python AI Bridge (HRIS AI Assistant — FastAPI)
  # Jembatan antara Frontend ↔ Openclaw LLM ↔ PostgreSQL
  ai-bridge:
    build:
      context: ./ai-bridge
      dockerfile: Dockerfile
    container_name: erp_ai_bridge
    ports:
      - "8083:8000"
    environment:
      - OPENCLAW_BASE_URL=https://ai.bcslabs.tech/v1
      - OPENCLAW_API_KEY=${OPENCLAW_API_KEY}
      - OPENCLAW_MODEL=${OPENCLAW_MODEL:-glm-4.7-flash}
      - DATABASE_URL=postgresql+asyncpg://bcs_admin:sangatrahasia@database:5432/mybcs_db
      - AI_BRIDGE_DEBUG=false
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Agar bisa akses Openclaw di host (jika lokal)
    depends_on:
      - database
    restart: always
    networks:
      - erp_network

  # 8. Python Microservice (DMS AI Module — Coming Soon)
  # python-ai-dms:
  #   image: ghcr.io/it-bcs-tech/erp-dms-ai:latest
  #   container_name: erp_python_dms
  #   ports:
  #     - "8082:8000"
  #   env_file:
  #     - .env
  #   volumes:
  #     - dms_documents:/app/uploads
  #   depends_on:
  #     - database
  #     - redis
  #   networks:
  #     - erp_network

# Definisi Jaringan Internal (Agar antar container bisa saling memanggil nama)
networks:
  erp_network:
    driver: bridge

# Definisi Storage Permanen (Agar data Database tidak hilang saat Docker dimatikan)
volumes:
  db_data:
  dms_documents:
  backend_storage:
  presensi_storage:

# hapus data volumes: docker-compose down -v